# Runs the whole backend stack (PostgreSQL + API) with one command:
#   docker compose up --build
# The API is then at http://localhost:4000/api
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: doorstep
      POSTGRES_PASSWORD: doorstep
      POSTGRES_DB: doorstep
    ports:
      - '5432:5432'
    volumes:
      - doorstep_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U doorstep']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: '4000'
      DATABASE_URL: postgresql://doorstep:doorstep@db:5432/doorstep
      JWT_SECRET: change-me-in-production
      # Set these to enable live Razorpay payments (mock mode if empty):
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  doorstep_pgdata:
