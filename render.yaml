# Render.com Blueprint — deploys the backend + a managed Postgres in one click.
# 1) Push this repo to GitHub.
# 2) On render.com: New → Blueprint → pick this repo. Render reads this file.
# 3) After deploy, your API is at https://<service>.onrender.com/api
databases:
  - name: doorstep-db
    plan: free
    databaseName: doorstep
    user: doorstep

services:
  - type: web
    name: doorstep-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npx tsx src/index.ts
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: doorstep-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEV_OTP
        value: '123456'
      # Add your Razorpay keys in the Render dashboard to enable live payments.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
